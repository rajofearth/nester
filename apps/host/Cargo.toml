[package]
name = "nester-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The host app: sync server + GPUI window"

[[bin]]
name = "nester-host"
path = "src/main.rs"

[dependencies]
nester-core = { path = "../../crates/nester-core" }
nester-server = { path = "../../crates/nester-server" }
anyhow.workspace = true
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender = "0.2"
rand.workspace = true
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
dirs = "6"
qrcode = "0.14"
toml = "0.9"
rfd = "0.15"
rusqlite.workspace = true

gpui = { git = "https://github.com/zed-industries/zed", rev = "424a68244aa9b8ac9d4766e51b0824d2b2174bd7" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "424a68244aa9b8ac9d4766e51b0824d2b2174bd7", features = ["font-kit"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
winreg = "0.55"
